services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kufinder
      POSTGRES_USER: kufinder
      POSTGRES_PASSWORD: kufinder
    ports:
      - "5432:5432"
    volumes:
      - kufinder_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kufinder -d kufinder"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://kufinder:kufinder@db:5432/kufinder
      LOCAL_STORAGE_PATH: /data/uploads
    ports:
      - "8000:8000"
    volumes:
      - kufinder_uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]

volumes:
  kufinder_postgres:
  kufinder_uploads:
