[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kufinder-backend"
version = "0.1.0"
description = "KU-finder lost-and-found matching API"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "boto3>=1.40,<2",
  "fastapi>=0.116,<1",
  "pillow>=11.3,<13",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy[asyncio]>=2.0.43,<2.2",
  "uvicorn[standard]>=0.5,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]
vlm = [
  "accelerate>=1.10,<2",
  "einops>=0.8,<1",
  "huggingface-hub<1.0",
  "numpy>=2.0,<3",
  "timm>=1.0,<2",
  "torch>=2.5,<3",
  "transformers==4.51.3",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["research"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
